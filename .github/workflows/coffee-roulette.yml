name: Coffee Roulette pairing

on:
  # Runs automatically every Monday at 13:00 UTC (9am Eastern in summer, 8am in winter).
  schedule:
    - cron: "0 13 * * 1"
  # Also runnable on demand from the Actions tab, for an extra round or a re-run.
  workflow_dispatch:
    inputs:
      require_overlap:
        description: Only pair people who share an availability slot
        type: boolean
        default: false
      seed:
        description: Optional seed for a reproducible shuffle (leave blank for random)
        type: string
        default: ""
      dry_run:
        description: Preview the pairings without storing the round or mailing anyone
        type: boolean
        default: false

# The roster and the rounds live in Postgres, so nothing is committed back here.
permissions:
  contents: read

concurrency:
  group: coffee-roulette
  cancel-in-progress: false

jobs:
  pair:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check the database secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Run the pairing round
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # On a scheduled run these are empty, so the command uses its defaults.
          REQUIRE_OVERLAP: ${{ inputs.require_overlap }}
          SEED: ${{ inputs.seed }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=(--source github-action --emails pairings.json)
          if [ "$REQUIRE_OVERLAP" = "true" ]; then
            ARGS+=(--require-overlap)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "$SEED" ]; then
            ARGS+=(--seed "$SEED")
          fi
          python -m app.cli run-round "${ARGS[@]}" | tee pairings.txt

      - name: Publish the pairings to the run summary
        run: |
          {
            echo "## Coffee Roulette pairings"
            echo
            echo '```'
            cat pairings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy of the pairings as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairings
          path: |
            pairings.txt
            pairings.json
          retention-days: 90

      - name: Hand the invitations to Power Automate
        # A preview must not mail anyone, so this is skipped on a dry run.
        if: ${{ inputs.dry_run != true }}
        env:
          # Repository secret holding the HTTP trigger URL of the mail flow.
          FLOW_URL: ${{ secrets.COFFEE_FLOW_URL }}
        run: |
          if [ -z "$FLOW_URL" ]; then
            echo "No COFFEE_FLOW_URL secret set; skipping the email step."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$FLOW_URL" \
            -H "Content-Type: application/json" \
            --data-binary @pairings.json
          echo "Handed the invitations to the flow."
